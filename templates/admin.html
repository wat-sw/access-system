<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入退室管理 - 管理ページ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .table-row-same-date {
            background-color: rgba(0,0,0,0.02);
        }
        .no-data {
            color: #999;
            font-style: italic;
        }
        .import-export-area {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
        }
        .csv-preview {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            background-color: #f8f9fa;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <!-- CSV インポート・エクスポート エリア -->
        <div class="card mb-4">
            <div class="card-header">
                <h4><i class="bi bi-file-earmark-arrow-up-down"></i> CSV データ管理</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <!-- CSVエクスポート -->
                    <div class="col-md-6">
                        <h5><i class="bi bi-download"></i> CSVエクスポート</h5>
                        <div class="mb-3">
                            <label for="exportMonth" class="form-label">エクスポート期間:</label>
                            <select id="exportMonth" class="form-control">
                                <option value="all">すべての記録</option>
                                <option value="2025-07">2025年7月</option>
                                <option value="2025-06">2025年6月</option>
                                <option value="2025-05">2025年5月</option>
                                <option value="2025-04">2025年4月</option>
                                <option value="2025-03">2025年3月</option>
                                <option value="2025-02">2025年2月</option>
                                <option value="2025-01">2025年1月</option>
                            </select>
                        </div>
                        <button id="exportBtn" class="btn btn-success">
                            <i class="bi bi-download"></i> CSVをダウンロード
                        </button>
                    </div>
                    
                    <!-- CSVインポート -->
                    <div class="col-md-6">
                        <h5><i class="bi bi-upload"></i> CSVインポート</h5>
                        <div class="mb-3">
                            <label for="csvFile" class="form-label">CSVファイルを選択:</label>
                            <input type="file" id="csvFile" class="form-control" accept=".csv" />
                        </div>
                        <button id="importBtn" class="btn btn-primary" disabled>
                            <i class="bi bi-upload"></i> CSVをインポート
                        </button>
                        <div id="csvPreview" class="csv-preview" style="display: none;">
                            <strong>プレビュー:</strong>
                            <div id="csvContent"></div>
                        </div>
                        <div id="importStatus" class="mt-2"></div>
                    </div>
                </div>
                
                <!-- CSV形式の説明 -->
                <div class="mt-4">
                    <h6><i class="bi bi-info-circle"></i> CSV形式について</h6>
                    <p class="text-muted small">
                        <strong>エクスポート形式:</strong> 日付, 名前, 種類, 時間, ID<br>
                        <strong>インポート形式:</strong> 日付, 名前, 種類, 時間 (IDは自動生成)<br>
                        <strong>種類:</strong> 「入室」または「退室」<br>
                        <strong>例:</strong> 2025-07-10, 山田太郎, 入室, 09:00
                    </p>
                </div>
            </div>
        </div>

        <!-- 入退室履歴 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2>入退室履歴</h2>
                <div>
                    <span id="recordCount" class="badge bg-secondary me-2">記録数: 0</span>
                    <a href="/" class="btn btn-outline-primary">
                        <i class="bi bi-house"></i> メインページへ
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="mb-3 d-flex align-items-center">
                    <label for="monthFilter" class="form-label me-2 mb-0">月を選択:</label>
                    <input type="month" id="monthFilter" class="form-control" style="max-width: 200px;">
                </div>
                
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th width="15%">日付</th>
                                <th width="20%">名前（入室）</th>
                                <th width="15%">入室時間</th>
                                <th width="20%">名前（退室）</th>
                                <th width="15%">退室時間</th>
                                <th width="15%">操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTable">
                            <!-- ここに日付ごとの入退室記録が動的に生成されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 編集モーダル -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">記録の編集</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="recordId">
                        <input type="hidden" id="editType">
                        <div class="mb-3">
                            <label for="editUserName" class="form-label">名前</label>
                            <input type="text" class="form-control" id="editUserName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editDate" class="form-label">日付</label>
                            <input type="date" class="form-control" id="editDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="editTime" class="form-label">時間</label>
                            <input type="time" class="form-control" id="editTime" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="saveChanges">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // グローバル変数
        let globalRecords = [];
        
        // CSV関連の機能
        
        // CSVエクスポート機能
        document.getElementById('exportBtn').addEventListener('click', function() {
            const month = document.getElementById('exportMonth').value;
            const url = month === 'all' ? '/api/export-records' : `/api/export-records?month=${month}`;
            
            // ダウンロード用のリンクを作成
            const link = document.createElement('a');
            link.href = url;
            link.download = `access_records_${month}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
        
        // CSVファイル選択時の処理
        document.getElementById('csvFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const importBtn = document.getElementById('importBtn');
            const csvPreview = document.getElementById('csvPreview');
            const csvContent = document.getElementById('csvContent');
            
            if (file && file.type === 'text/csv') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const csvText = e.target.result;
                    const lines = csvText.split('\n').slice(0, 5); // 最初の5行をプレビュー
                    
                    csvContent.innerHTML = lines.map(line => `<div>${line}</div>`).join('');
                    csvPreview.style.display = 'block';
                    importBtn.disabled = false;
                };
                reader.readAsText(file);
            } else {
                csvPreview.style.display = 'none';
                importBtn.disabled = true;
                alert('CSVファイルを選択してください。');
            }
        });
        
        // CSVインポート機能
        document.getElementById('importBtn').addEventListener('click', function() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];
            const statusDiv = document.getElementById('importStatus');
            
            if (!file) {
                alert('ファイルを選択してください。');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csvText = e.target.result;
                    const records = parseCSV(csvText);
                    
                    if (records.length === 0) {
                        throw new Error('有効なデータが見つかりません。');
                    }
                    
                    // サーバーに送信
                    fetch('/api/import-records', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ records: records })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            statusDiv.innerHTML = `<div class="alert alert-success">✅ ${data.imported}件のデータをインポートしました！</div>`;
                            setTimeout(() => {
                                window.location.reload();
                            }, 2000);
                        } else {
                            statusDiv.innerHTML = `<div class="alert alert-danger">❌ エラー: ${data.error}</div>`;
                        }
                    })
                    .catch(error => {
                        statusDiv.innerHTML = `<div class="alert alert-danger">❌ インポートエラー: ${error.message}</div>`;
                    });
                    
                } catch (error) {
                    statusDiv.innerHTML = `<div class="alert alert-danger">❌ CSVの解析エラー: ${error.message}</div>`;
                }
            };
            reader.readAsText(file);
        });
        
        // CSV解析関数
        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim());
            const records = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // CSVを解析（カンマ区切り）
                const values = line.split(',').map(v => v.trim().replace(/"/g, ''));
                
                if (values.length >= 4) {
                    const [date, userName, type, time] = values;
                    
                    // データの検証
                    if (!date || !userName || !type || !time) continue;
                    
                    // 種類の変換
                    let recordType;
                    if (type === '入室' || type === 'in') {
                        recordType = 'in';
                    } else if (type === '退室' || type === 'out') {
                        recordType = 'out';
                    } else {
                        continue; // 無効な種類はスキップ
                    }
                    
                    // タイムスタンプの作成
                    const timestamp = new Date(`${date}T${time}:00`).toISOString();
                    
                    records.push({
                        userName: userName,
                        type: recordType,
                        timestamp: timestamp
                    });
                }
            }
            
            return records;
        }
        
        // 既存の履歴管理機能
        
        // 履歴データを日付ごとにグループ化する関数
        function processRecords(records) {
            const dateUserMap = {};
            
            records.forEach(record => {
                const timestamp = new Date(record.timestamp);
                const date = timestamp.toISOString().split('T')[0];
                const time = timestamp.toTimeString().split(' ')[0].substring(0, 5);
                const user = record.userName;
                const type = record.type;
                const recordId = record.id;
                
                if (!dateUserMap[date]) {
                    dateUserMap[date] = {};
                }
                
                if (!dateUserMap[date][user]) {
                    dateUserMap[date][user] = { in: null, out: null, inId: null, outId: null };
                }
                
                if (type === 'in') {
                    if (!dateUserMap[date][user].in || timestamp > new Date(dateUserMap[date][user].in)) {
                        dateUserMap[date][user].in = time;
                        dateUserMap[date][user].inId = recordId;
                    }
                } else if (type === 'out') {
                    if (!dateUserMap[date][user].out || timestamp > new Date(dateUserMap[date][user].out)) {
                        dateUserMap[date][user].out = time;
                        dateUserMap[date][user].outId = recordId;
                    }
                }
            });
            
            const sortedDates = Object.keys(dateUserMap).sort().reverse();
            return { dateUserMap, sortedDates };
        }
        
        // テーブルを更新する関数
        function updateTable(records) {
            const { dateUserMap, sortedDates } = processRecords(records);
            const tableBody = document.getElementById('recordsTable');
            const recordCount = document.getElementById('recordCount');
            
            tableBody.innerHTML = '';
            recordCount.textContent = `記録数: ${records.length}`;
            
            let rowClass = '';
            
            sortedDates.forEach(date => {
                const users = Object.keys(dateUserMap[date]);
                rowClass = rowClass === 'table-row-same-date' ? '' : 'table-row-same-date';
                
                users.forEach((user, userIndex) => {
                    const userData = dateUserMap[date][user];
                    const row = document.createElement('tr');
                    row.className = rowClass;
                    
                    // 日付
                    const dateCell = document.createElement('td');
                    if (userIndex === 0) {
                        const [year, month, day] = date.split('-');
                        dateCell.textContent = `${year}年${parseInt(month)}月${parseInt(day)}日`;
                        dateCell.rowSpan = users.length;
                    } else {
                        dateCell.style.display = 'none';
                    }
                    
                    // 入室情報
                    const inNameCell = document.createElement('td');
                    inNameCell.textContent = userData.in ? user : '';
                    
                    const inTimeCell = document.createElement('td');
                    inTimeCell.textContent = userData.in || '';
                    if (!userData.in) {
                        inTimeCell.classList.add('no-data');
                        inTimeCell.textContent = '記録なし';
                    }
                    
                    // 退室情報
                    const outNameCell = document.createElement('td');
                    outNameCell.textContent = userData.out ? user : '';
                    
                    const outTimeCell = document.createElement('td');
                    outTimeCell.textContent = userData.out || '';
                    if (!userData.out) {
                        outTimeCell.classList.add('no-data');
                        outTimeCell.textContent = '記録なし';
                    }
                    
                    // 操作ボタン
                    const actionCell = document.createElement('td');
                    
                    // 入室編集ボタン
                    if (userData.in) {
                        const editInBtn = document.createElement('button');
                        editInBtn.className = 'btn btn-sm btn-outline-primary me-1';
                        editInBtn.innerHTML = '<i class="bi bi-pencil"></i> 入室';
                        editInBtn.setAttribute('data-record-id', userData.inId);
                        editInBtn.setAttribute('data-type', 'in');
                        editInBtn.setAttribute('data-user', user);
                        editInBtn.setAttribute('data-date', date);
                        editInBtn.setAttribute('data-time', userData.in);
                        editInBtn.addEventListener('click', handleEdit);
                        actionCell.appendChild(editInBtn);

                        // 入室削除ボタン
                        const deleteInBtn = document.createElement('button');
                        deleteInBtn.className = 'btn btn-sm btn-outline-danger me-1';
                        deleteInBtn.innerHTML = '<i class="bi bi-trash"></i>';
                        deleteInBtn.setAttribute('data-record-id', userData.inId);
                        deleteInBtn.addEventListener('click', handleDelete);
                        actionCell.appendChild(deleteInBtn);
                    }
                    
                    // 退室編集ボタン
                    if (userData.out) {
                        const editOutBtn = document.createElement('button');
                        editOutBtn.className = 'btn btn-sm btn-outline-secondary me-1';
                        editOutBtn.innerHTML = '<i class="bi bi-pencil"></i> 退室';
                        editOutBtn.setAttribute('data-record-id', userData.outId);
                        editOutBtn.setAttribute('data-type', 'out');
                        editOutBtn.setAttribute('data-user', user);
                        editOutBtn.setAttribute('data-date', date);
                        editOutBtn.setAttribute('data-time', userData.out);
                        editOutBtn.addEventListener('click', handleEdit);
                        actionCell.appendChild(editOutBtn);

                        // 退室削除ボタン
                        const deleteOutBtn = document.createElement('button');
                        deleteOutBtn.className = 'btn btn-sm btn-outline-danger me-1';
                        deleteOutBtn.innerHTML = '<i class="bi bi-trash"></i>';
                        deleteOutBtn.setAttribute('data-record-id', userData.outId);
                        deleteOutBtn.addEventListener('click', handleDelete);
                        actionCell.appendChild(deleteOutBtn);
                    }
                    
                    // 行に追加
                    row.appendChild(dateCell);
                    row.appendChild(inNameCell);
                    row.appendChild(inTimeCell);
                    row.appendChild(outNameCell);
                    row.appendChild(outTimeCell);
                    row.appendChild(actionCell);
                    
                    tableBody.appendChild(row);
                });
            });
            
            // テーブルが空の場合
            if (sortedDates.length === 0) {
                const emptyRow = document.createElement('tr');
                const emptyCell = document.createElement('td');
                emptyCell.colSpan = 6;
                emptyCell.textContent = '記録がありません';
                emptyCell.className = 'text-center py-3';
                emptyRow.appendChild(emptyCell);
                tableBody.appendChild(emptyRow);
            }
        }
        
        // 編集ボタンのクリックハンドラ
        function handleEdit(event) {
            const btn = event.currentTarget;
            const recordId = btn.getAttribute('data-record-id');
            const type = btn.getAttribute('data-type');
            const user = btn.getAttribute('data-user');
            const date = btn.getAttribute('data-date');
            const time = btn.getAttribute('data-time');
            
            document.getElementById('recordId').value = recordId;
            document.getElementById('editType').value = type;
            document.getElementById('editUserName').value = user;
            document.getElementById('editDate').value = date;
            document.getElementById('editTime').value = time;
            
            document.querySelector('.modal-title').textContent = type === 'in' ? '入室記録の編集' : '退室記録の編集';
            
            const modal = new bootstrap.Modal(document.getElementById('editModal'));
            modal.show();
        }

        // 削除ボタンのクリックハンドラ
        function handleDelete(event) {
            const btn = event.currentTarget;
            const recordId = btn.getAttribute('data-record-id');
            
            if (confirm('この記録を削除してもよろしいですか？')) {
                fetch(`/api/access/${recordId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('記録を削除しました');
                        window.location.reload();
                    } else {
                        alert('削除中にエラーが発生しました: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('削除中にエラーが発生しました');
                });
            }
        }
        
        // サーバーから記録を取得する関数
        function fetchRecords(month) {
            const allRecords = {{ records|tojson }};
            
            let filteredRecords = allRecords;
            if (month) {
                filteredRecords = allRecords.filter(record => {
                    return record.timestamp.startsWith(month);
                });
            }
            
            updateTable(filteredRecords);
            return allRecords;
        }
        
        // ページ読み込み時
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const year = today.getFullYear();
            const month = (today.getMonth() + 1).toString().padStart(2, '0');
            const currentMonth = `${year}-${month}`;
            
            document.getElementById('monthFilter').value = currentMonth;
            globalRecords = fetchRecords(currentMonth);
            
            // エクスポート月のデフォルト値も設定
            document.getElementById('exportMonth').value = currentMonth;
        });
        
        // 保存ボタンのクリックハンドラ
        document.getElementById('saveChanges').addEventListener('click', function() {
            const recordId = document.getElementById('recordId').value;
            const type = document.getElementById('editType').value;
            const userName = document.getElementById('editUserName').value;
            const date = document.getElementById('editDate').value;
            const time = document.getElementById('editTime').value;
            
            const timestamp = new Date(`${date}T${time}:00`).toISOString();
            
            const formData = new FormData();
            formData.append('userName', userName);
            formData.append('type', type);
            formData.append('timestamp', timestamp);
            
            fetch(`/api/access/${recordId}`, {
                method: 'PUT',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.reload();
                } else {
                    alert('エラーが発生しました');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('エラーが発生しました');
            });
        });
        
        // 月フィルターの変更イベント
        document.getElementById('monthFilter').addEventListener('change', function() {
            fetchRecords(this.value);
        });
    </script>
</body>
</html>
